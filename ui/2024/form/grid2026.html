<style>
/*
 * This is the 2026 ui-button.css file
 * UI Redesign — Button component
 * Placement: AFTER existing Dojo/Claro CSS and gfxGridx.css.
 *
 * Targets Dojo Claro Button, DropDownButton, ComboButton and ToggleButton.
 * Visual-only rules: Dojo remains responsible for behavior.
 *
 * Variant hook:
 *   Add class="ui-button--primary" to the Dojo widget's root DOM node
 *   for a button that merits persistent Primary emphasis.
 *
 * Otherwise, buttons receive the restrained Regular/Secondary treatment.
 * Default-action semantics do not imply Primary styling.
 */

/* Shared button face */
.claro .dijitButton .dijitButtonNode,
.claro .dijitDropDownButton .dijitButtonNode,
.claro .dijitComboButton .dijitButtonNode,
.claro .dijitToggleButton .dijitButtonNode {
    box-sizing: border-box;
    min-height: var(--ui-button-height);
    border: 1px solid var(--ui-color-border);
    border-radius: var(--ui-button-radius);
    background-color: #fff;
    background-image: none;
    box-shadow: none;
    color: var(--ui-button-text);
    font: inherit;
    line-height: normal;
    padding: 6px 10px;
    text-shadow: none;
    transition: background-color 100ms ease, border-color 100ms ease;
}

/* Keep icon/label spacing consistent where Dojo supplies separate nodes. */
.claro .dijitButton .dijitButtonText,
.claro .dijitDropDownButton .dijitButtonText,
.claro .dijitComboButton .dijitButtonText,
.claro .dijitToggleButton .dijitButtonText {
    padding: 0;
}

.claro .dijitButton .dijitButtonContents,
.claro .dijitDropDownButton .dijitButtonContents,
.claro .dijitComboButton .dijitButtonContents,
.claro .dijitToggleButton .dijitButtonContents {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--ui-button-gap);
}

/* Hover: introduce the very-light Claro Blue surface. */
.claro .dijitButtonHover .dijitButtonNode,
.claro .dijitDropDownButtonHover .dijitButtonNode,
.claro .dijitComboButtonHover .dijitButtonNode,
.claro .dijitToggleButtonHover .dijitButtonNode {
    border-color: var(--ui-color-border);
    background-color: var(--ui-color-surface-hover);
    background-image: none;
    box-shadow: none;
    color: var(--ui-button-text);
}

/* Pressed / active: slightly stronger than hover, without a shadow. */
.claro .dijitButtonActive .dijitButtonNode,
.claro .dijitDropDownButtonActive .dijitButtonNode,
.claro .dijitComboButtonActive .dijitButtonNode,
.claro .dijitToggleButtonActive .dijitButtonNode {
    background-color: var(--ui-color-surface-active);
    background-image: none;
    box-shadow: none;
}

/* Focus is independent of hover and the Primary variant. */
.claro .dijitButtonFocused .dijitButtonNode,
.claro .dijitDropDownButtonFocused .dijitButtonNode,
.claro .dijitComboButtonFocused .dijitButtonNode,
.claro .dijitToggleButtonFocused .dijitButtonNode {
    outline: 2px solid var(--ui-color-focus-ring);
    outline-offset: 1px;
}

/* Disabled: subdued but still legible. */
.claro .dijitButtonDisabled .dijitButtonNode,
.claro .dijitDropDownButtonDisabled .dijitButtonNode,
.claro .dijitComboButtonDisabled .dijitButtonNode,
.claro .dijitToggleButtonDisabled .dijitButtonNode {
    border-color: var(--ui-button-disabled-border);
    background-color: var(--ui-button-disabled-background);
    background-image: none;
    box-shadow: none;
    color: var(--ui-button-disabled-text);
    cursor: default;
    opacity: 1;
}

/*
 * Primary variant.
 * Apply .ui-button--primary to the Dojo widget root, not the inner node.
 * Use selectively; do not infer Primary from default-action status.
 */
.claro .ui-button--primary .dijitButtonNode {
    border-color: var(--ui-button-primary-background);
    background-color: var(--ui-button-primary-background);
    background-image: none;
    color: var(--ui-button-primary-text);
}

.claro .ui-button--primary.dijitButtonHover .dijitButtonNode,
.claro .ui-button--primary.dijitDropDownButtonHover .dijitButtonNode,
.claro .ui-button--primary.dijitComboButtonHover .dijitButtonNode,
.claro .ui-button--primary.dijitToggleButtonHover .dijitButtonNode {
    border-color: var(--ui-button-primary-background-hover);
    background-color: var(--ui-button-primary-background-hover);
    color: var(--ui-button-primary-text);
}

.claro .ui-button--primary.dijitButtonActive .dijitButtonNode,
.claro .ui-button--primary.dijitDropDownButtonActive .dijitButtonNode,
.claro .ui-button--primary.dijitComboButtonActive .dijitButtonNode,
.claro .ui-button--primary.dijitToggleButtonActive .dijitButtonNode {
    border-color: var(--ui-button-primary-background-active);
    background-color: var(--ui-button-primary-background-active);
    color: var(--ui-button-primary-text);
}

.claro .ui-button--primary.dijitButtonDisabled .dijitButtonNode,
.claro .ui-button--primary.dijitDropDownButtonDisabled .dijitButtonNode,
.claro .ui-button--primary.dijitComboButtonDisabled .dijitButtonNode,
.claro .ui-button--primary.dijitToggleButtonDisabled .dijitButtonNode {
    border-color: var(--ui-button-disabled-border);
    background-color: var(--ui-button-disabled-background);
    color: var(--ui-button-disabled-text);
}

/* Toggle buttons: selected state remains persistent; hover stays subtle. */
.claro .dijitToggleButtonChecked .dijitButtonNode {
    border-color: var(--ui-color-border);
    background-color: var(--ui-color-surface-active);
    background-image: none;
    color: var(--ui-button-text);
}

.claro .dijitToggleButtonChecked.dijitToggleButtonHover .dijitButtonNode {
    background-color: var(--ui-color-surface-hover);
}

/* Honor users who request reduced motion. */
@media (prefers-reduced-motion: reduce) {
    .claro .dijitButton .dijitButtonNode,
    .claro .dijitDropDownButton .dijitButtonNode,
    .claro .dijitComboButton .dijitButtonNode,
    .claro .dijitToggleButton .dijitButtonNode {
        transition: none;
    }
}

</style>

	store.hasChildren = function(id, item){
		return item && store.getValues(item, 'children').length;
	};
	/* 
	 * Dojo don't provide sort interface for tree store, so it's hard to do sorting for children. 
	 * User should add their own sorting logic here to sort children manually.
	 */
	store.getChildren = function(item, req){
		var children = store.getValues(item, 'children'),
			attr,
			t = this,		//store object
			sorts = req.sort;

		var sorting = function (a, b, index) {
			if (!sorts[index]) return 0;

			var attr = sorts[index].attribute;
			var va = t.getValue(a, attr);
			var vb = t.getValue(b, attr);

			if (va == vb) {
				return sorting(a, b, ++index);
			}
			return !sorts[index].descending ? (va > vb ? 1 : -1) : (va <= vb ? 1 : -1);
		}

		if (sorts && sorts.length) {
			children.sort(function(a, b) {
				return sorting(a, b, 0);
			});
		}

		return children;
	};

	storeAsync = storeFactory({
